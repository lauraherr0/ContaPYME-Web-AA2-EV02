<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ titulo }} | ContaPYME</title></head>
<body>
<main>
<h1>{{ titulo }}</h1>
<p>{{ usuario.nombre }} · {{ usuario.correo }}</p>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post">
{% csrf_token %}
{% if formulario %}
{{ formulario.as_p }}
<button type="submit">Guardar cambios</button>
{% else %}
<p>Confirma si deseas eliminar este usuario.</p>
<button type="submit">Confirmar eliminación</button>
{% endif %}
</form>
<p><a href="{% url 'usuarios' %}">Volver al listado</a></p>
</main>
</body>
</html>
